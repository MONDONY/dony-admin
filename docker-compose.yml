services:
  admin:
    image: ghcr.io/mondony/yadony-admin:${IMAGE_TAG:-latest}
    container_name: yadony_admin
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - yadony_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/siragbe/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  yadony_internal:
    external: true
    name: yadony_yadony_internal
