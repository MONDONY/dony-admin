name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le runner porte une source apt Google Chrome dont l'index est régulièrement
      # corrompu (« Hash Sum mismatch » sur dl.google.com, 2026-09-09) : `--with-deps`
      # lance un apt-get update qui échoue alors en bloc, et le job meurt avant le
      # moindre test. On écarte cette source, sans rapport avec les dépendances dont
      # Playwright a besoin, avant d'installer.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          # Clés Firebase laissées vides : le plugin firebase.client.ts saute alors
          # l'initialisation. Les sessions E2E sont seedées directement dans le
          # store via app/plugins/expose-auth.client.ts (voir tests/e2e/*.spec.ts).
          # NUXT_PUBLIC_API_BASE_URL est requis pour que les mocks page.route matchent.
          NUXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
